name: Build Fonts

on:
  push:
    branches:
      - main
    paths:
      - sources/Plangothic-Regular.7z
      - tools/optimize_glyph.py
      - tools/convert_font.py
      - tools/build-fonts/**
      - .github/workflows/build-fonts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plangothic-build-fonts
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  FONTFORGE_RELEASE_ID: "20251009"
  FONTFORGE_VERSION: "2025-10-09"

jobs:
  build:
    name: Build and deploy fonts
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/build-fonts/requirements.txt

      - name: Restore FontForge cache
        id: fontforge-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/plangothic/fontforge-${{ env.FONTFORGE_VERSION }}
          key: fontforge-${{ runner.os }}-${{ runner.arch }}-${{ env.FONTFORGE_VERSION }}

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install --no-install-recommends -y p7zip-full

      - name: Download and extract FontForge
        if: steps.fontforge-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cache_dir="$HOME/.cache/plangothic/fontforge-${FONTFORGE_VERSION}"
          mkdir -p "$cache_dir"

          appimage="$cache_dir/FontForge.AppImage"
          curl --fail --location --retry 3 \
            --output "$appimage" \
            "https://github.com/fontforge/fontforge/releases/download/${FONTFORGE_RELEASE_ID}/FontForge-${FONTFORGE_VERSION}-Linux-x86_64.AppImage"
          chmod +x "$appimage"

          (
            cd "$cache_dir"
            rm -rf appdir squashfs-root
            ./FontForge.AppImage --appimage-extract >/dev/null
            mv squashfs-root appdir
            rm -f FontForge.AppImage
          )

      - name: Configure FontForge
        shell: bash
        run: |
          set -euo pipefail

          appdir="$HOME/.cache/plangothic/fontforge-${FONTFORGE_VERSION}/appdir"
          test -x "$appdir/usr/bin/fontforge"

          sudo tee /usr/local/bin/fontforge >/dev/null <<EOF
          #!/usr/bin/env bash
          export APPDIR="$appdir"
          export PATH="\$APPDIR/usr/bin:\$PATH"
          export LD_LIBRARY_PATH="\$APPDIR/usr/lib:\${LD_LIBRARY_PATH:-}"
          export PYTHONPATH="\$APPDIR/usr/lib/python3/dist-packages:\${PYTHONPATH:-}"
          exec "\$APPDIR/usr/bin/fontforge" "\$@"
          EOF
          sudo chmod +x /usr/local/bin/fontforge

          fontforge -version

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --requirement tools/build-fonts/requirements.txt

      - name: Extract source fonts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build optimized fonts build-info
          mkdir -p build
          7z x -y sources/Plangothic-Regular.7z -obuild

      - name: Build and validate fonts
        shell: bash
        run: |
          set -euo pipefail
          python tools/build-fonts/build_fonts.py \
            --input-dir build \
            --optimized-dir optimized \
            --output-dir fonts \
            --build-info-dir build-info \
            --source-archive sources/Plangothic-Regular.7z \
            --jobs "$(nproc)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: plangothic-fonts-${{ github.run_number }}
          path: |
            fonts/
            build-info/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Deploy generated snapshot to build branch
        shell: bash
        run: |
          set -euo pipefail

          deploy_dir="$RUNNER_TEMP/plangothic-build-branch"
          rm -rf "$deploy_dir"
          mkdir -p "$deploy_dir"
          cp -a fonts build-info "$deploy_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan generated-build
          git rm -rf --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +

          cp -a "$deploy_dir/fonts" ./fonts
          cp -a "$deploy_dir/build-info" ./build-info

          git add fonts build-info
          git commit -m "build: ${GITHUB_SHA:0:7}"
          git push --force origin HEAD:build

      - name: Write workflow summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Font build completed"
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: \`$GITHUB_RUN_NUMBER\`"
            echo "- Output branch: \`build\`"
            echo
            echo "### Generated files"
            echo '```text'
            find fonts -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Debug build failure
        if: failure()
        shell: bash
        run: |
          echo "===== Generated font files ====="
          find . -type f \( -name '*.ttf' -o -name '*.otf' -o -name '*.ttc' -o -name '*.woff2' \) | sort || true
          echo "===== Disk usage ====="
          df -h
          echo "===== Git status ====="
          git status --short --branch || true
