name: Release Packaging

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      font_name:
        description: Font name prefix for package files
        required: false
        default: Plangothic
        type: string
      tag_version:
        description: Version used for a manual package run; defaults to dev-RUN_NUMBER
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-packaging-${{ github.event.release.tag_name || inputs.tag_version || github.run_id }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  DEFAULT_FONT_NAME: Plangothic

jobs:
  package:
    name: Package build branch
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout packaging tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          path: source
          fetch-depth: 1

      - name: Checkout generated fonts
        uses: actions/checkout@v6
        with:
          ref: build
          path: build-output
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve package variables
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.tag_version }}
          INPUT_FONT_NAME: ${{ inputs.font_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version="$RELEASE_TAG"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="dev-${GITHUB_RUN_NUMBER}"
          fi

          font_name="${INPUT_FONT_NAME:-$DEFAULT_FONT_NAME}"

          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'FONT_NAME=%s\n' "$font_name" >> "$GITHUB_ENV"

      - name: Verify build provenance
        shell: bash
        run: |
          set -euo pipefail

          expected_sha="$(git -C source rev-parse HEAD)"
          expected_fingerprint="$(python source/tools/build-fonts/provenance.py --repo-root source)"

          readarray -t build_values < <(python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path('build-output/build-info/build-info.json').read_text(encoding='utf-8'))
          print(info['source']['commit_sha'])
          print(info['source']['input_fingerprint'])
          PY
          )
          built_sha="${build_values[0]}"
          built_fingerprint="${build_values[1]}"

          echo "Selected source commit:      $expected_sha"
          echo "Build branch source commit:  $built_sha"
          echo "Selected input fingerprint:  $expected_fingerprint"
          echo "Build branch fingerprint:    $built_fingerprint"

          if [[ "$expected_fingerprint" != "$built_fingerprint" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
              echo "::error::The build branch does not match the font-building inputs at release $VERSION. Run Build Fonts on the release tag before publishing."
              exit 1
            fi

            echo "::warning::The selected ref and build branch use different font-building inputs. Manual packaging will continue."
          elif [[ "$expected_sha" != "$built_sha" ]]; then
            echo "::notice::The commits differ, but all font-building inputs are identical; packaging is safe to continue."
          fi

      - name: Install packaging dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install --no-install-recommends -y p7zip-full

      - name: Create release packages
        shell: bash
        run: |
          set -euo pipefail
          python source/tools/build-fonts/package_release.py \
            --fonts-dir build-output/fonts \
            --dist-dir dist \
            --font-name "$FONT_NAME" \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY"

      - name: Upload manual-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FONT_NAME }}-packages-${{ env.VERSION }}
          path: dist/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload assets to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.VERSION }}
          fail_on_unmatched_files: true
          files: |
            dist/*.7z
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/${{ env.FONT_NAME }}-Static-${{ env.VERSION }}/*.ttf

      - name: Update release download table
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release view "$VERSION" --json body --jq '.body // ""' > current-release-notes.md
          python source/tools/build-fonts/update_release_notes.py \
            --current-body current-release-notes.md \
            --block-file dist/download-links.md \
            --output updated-release-notes.md
          gh release edit "$VERSION" --notes-file updated-release-notes.md

      - name: Write workflow summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Release packages created"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Font prefix: \`$FONT_NAME\`"

            built_sha="$(
            python -c 'import json; from pathlib import Path; print(json.loads(Path("build-output/build-info/build-info.json").read_text(encoding="utf-8"))["source"]["commit_sha"])'
            )"

            echo "- Build branch source: \`$built_sha\`"
            echo
            echo "### Assets"
            echo '```text'
            find dist -maxdepth 2 -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
